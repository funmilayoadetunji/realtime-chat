services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
  gateway1: &gateway
    build: .
    environment: {REDIS_URL: "redis://redis:6379/0"}
    depends_on: [redis]
  gateway2: *gateway
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: {REDIS_URL: "redis://redis:6379/0", DB_PATH: /data/chat.db}
    volumes: [archive:/data]
    depends_on: [redis]
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [gateway1, gateway2]
volumes: {redis-data: {}, archive: {}}
