<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime Chat</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f3f4f6;--me:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--fg:#e5e7eb;--mut:#9ca3af;--card:#1c1f27;--bd:#2a2e38}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
header b{flex:1}#status{font-size:12px;color:var(--mut)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:7px 11px;border-radius:12px;background:var(--card);word-wrap:break-word}
.m small{display:block;color:var(--mut);font-size:11px}.m.me{align-self:flex-end;background:var(--me);color:#fff}
.m.me small{color:#dbeafe}.m.pending{opacity:.5}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
input{flex:1;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--me);color:#fff;font:inherit;cursor:pointer}
#room{flex:0 0 120px}
</style></head><body>
<header><b>Realtime Chat</b><input id="room" value="general" aria-label="room"><span id="status">connecting…</span></header>
<div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Message…" maxlength="2000"><button>Send</button></form>
<script>
const user = localStorage.u || (localStorage.u = prompt("Username?") || "guest" + Math.floor(Math.random()*1000));
const $ = id => document.getElementById(id);
const rooms = {};                 // room -> {msgs:[], seen:Set, lastId:null}
const pending = new Map();        // cid -> {payload, sentAt}  (un-acked messages)
let ws, attempt = 0, room = $("room").value;

const cmp = (a, b) => { const [a1,a2] = a.split("-").map(Number), [b1,b2] = b.split("-").map(Number); return a1-b1 || a2-b2; };
const st = r => rooms[r] ||= {msgs: [], seen: new Set(), lastId: null};
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function add(m) {                 // dedupe by id (replay + live overlap), keep sorted
  const s = st(m.room); if (s.seen.has(m.id)) return; s.seen.add(m.id);
  s.msgs.push(m); s.msgs.sort((a,b) => cmp(a.id,b.id));
  if (!s.lastId || cmp(m.id, s.lastId) > 0) s.lastId = m.id;
  if (m.cid) pending.delete(m.cid);
}
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render() {
  const el = $("log"), bottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  const row = (m, cls) => `<div class="m ${cls}"><small>${esc(m.user)}</small>${esc(m.text)}</div>`;
  el.innerHTML = st(room).msgs.map(m => row(m, m.user === user ? "me" : "")).join("") +
    [...pending.values()].filter(p => p.payload.room === room)
      .map(p => row({user, text: p.payload.text}, "me pending")).join("");
  if (bottom) el.scrollTop = el.scrollHeight;
}
const status = t => $("status").textContent = t;

function join() { send({type: "join", room, last_id: st(room).lastId}); }  // last_id => server replays the gap

function connect() {
  status("connecting…");
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?user=${encodeURIComponent(user)}`);
  ws.onopen = () => { attempt = 0; status("online"); join(); for (const p of pending.values()) send(p.payload); };
  ws.onclose = () => {            // exponential backoff + jitter avoids reconnect stampedes
    status("reconnecting…");
    setTimeout(connect, Math.min(30000, 500 * 2 ** attempt++) * (0.5 + Math.random() / 2));
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "history") { m.messages.forEach(add); render(); }
    else if (m.type === "msg") { add(m); render(); }
    else if (m.type === "error" && m.cid && !m.retryable) { pending.delete(m.cid); render(); alert(m.detail); }
    // "ack": nothing to do; the fan-out copy of the message clears the pending bubble
  };
}
// Retry anything not echoed back within 4s. Same cid => server de-dupes, so this is safe.
setInterval(() => { const now = Date.now();
  for (const p of pending.values()) if (now - p.sentAt > 4000) { p.sentAt = now; send(p.payload); } }, 1000);

$("f").onsubmit = e => {
  e.preventDefault(); const text = $("t").value.trim(); if (!text) return; $("t").value = "";
  const payload = {type: "msg", room, text, cid: crypto.randomUUID()};
  pending.set(payload.cid, {payload, sentAt: Date.now()}); send(payload); render();
};
$("room").onchange = () => {
  send({type: "leave", room}); room = $("room").value.trim() || "general"; join(); render();
};
connect();
</script></body></html>
